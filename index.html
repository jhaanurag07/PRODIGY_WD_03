
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h1>⭕ Tic-Tac-Toe ❌</h1>

        <div class="mode">
            <label for="gameMode">Choose Game Mode:</label>
            <select id="gameMode">
                <option value="friend">Player vs Player</option>
                <option value="computer">Player vs Computer</option>
            </select>
        </div>

        <h2 id="status">Player X's Turn</h2>

        <div class="board" id="board">
            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>
            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>
            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>
        </div>

        <button id="restartBtn" class="restart">Restart Game</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
